<h2 mat-dialog-title class="dialog-header d-flex align-items-center gap-2">
    <mat-icon class="dialog-header-icon">analytics</mat-icon>
    <span class="dialog-title-text">{{title()}}</span>
</h2>

<mat-dialog-content class="pt-2" style="overflow-x: hidden;">
    @if (appliedFilters.length > 0) {
    <div class="filter-params-bar mb-3">
        <div class="filter-params-title">
            <mat-icon class="filter-title-icon">filter_alt</mat-icon>
            <span>Filtros aplicados:</span>
        </div>
        <div class="filter-chips-container">
            @for (filter of appliedFilters; track filter.label) {
            <div class="filter-badge">
                <mat-icon class="filter-badge-icon">{{filter.icon}}</mat-icon>
                <span class="filter-badge-label">{{filter.label}}:</span>
                <span class="filter-badge-value">{{filter.value}}</span>
            </div>
            }
        </div>
    </div>
    }

    <app-table [columns]="currentColumns" [pageable]="dataValue" (pageChange)="onPageChange($event)" />
</mat-dialog-content>
<mat-dialog-actions align="end" class="p-3">
    <div class="container-fluid py-2">
        <button mat-flat-button class="save-button" (click)="onPrintReport()">
            Descargar Reporte
        </button>
        <button mat-button mat-dialog-close class="cancel-button">Cancelar</button>
    </div>
</mat-dialog-actions>
