<div class="login-layout-wrapper">
  <!-- Left Column: Background Image with Blue Tint Overlay -->
  <div class="login-sidebar-panel">
    <div class="sidebar-overlay"></div>
    <div class="sidebar-content">
      @if (company.logoUrl) {
      <img [src]="company.logoUrl" alt="Logo" class="sidebar-logo-bottom" />
      }
    </div>
  </div>

  <!-- Right Column: Login Form Content -->
  <div class="login-form-panel">
    <div class="login-scroll-content">
      <!-- Card -->
      <div class="login-card">
        <!-- Card Header -->
        <div class="card-header-brand">
          <div class="brand-subtitle">PORTAL DE SALUD</div>
          <h2 class="brand-title">{{company.nameApp}}</h2>
        </div>

        <hr class="header-divider" />

        <!-- Form Heading -->
        <div class="form-intro">
          <h3 class="form-title">Iniciar sesión</h3>
          <p class="form-subtitle">Ingrese sus credenciales para acceder al sistema.</p>
        </div>

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="tryAuthenticate()" class="login-form">
          <!-- User field -->
          <div class="form-group-custom">
            <label for="user" class="input-label-custom">Usuario*</label>
            <mat-form-field appearance="outline" class="w-100">
              <mat-icon matPrefix class="input-icon-custom">person</mat-icon>
              <input matInput formControlName="user" required minlength="4" id="user" placeholder="Ingrese su usuario">
              @if (loginForm.get('user')?.hasError('required')) {
              <mat-error>El usuario es requerido</mat-error>
              }
            </mat-form-field>
          </div>

          <!-- Password field -->
          <div class="form-group-custom">
            <label for="password" class="input-label-custom">Contraseña*</label>
            <mat-form-field appearance="outline" class="w-100">
              <mat-icon matPrefix class="input-icon-custom">lock</mat-icon>
              <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" required
                id="password" placeholder="••••••••">
              <button mat-icon-button matSuffix (click)="hidePassword.set(!hidePassword())" type="button"
                class="password-toggle-btn">
                <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
            </mat-form-field>
          </div>

          <!-- Forgot Password -->
          <div class="forgot-pass-wrapper">
            <a href="javascript:void(0)" (click)="openRememberPassDialog()" class="forgot-password-link">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <!-- Submit Button -->
          <button mat-button type="submit" class="w-100 login-submit-btn" [disabled]="loginForm.invalid">
            <span>Iniciar sesión</span>
          </button>

          <!-- Creator -->
          <div class="creator-wrapper">
            <span class="creator-prefix">by </span>
            <a href="https://aurealab.com.co/" target="_blank" class="creator-link">
              aurealab
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
